{% extends 'base.html' %}
{% load static %}

{% block content %}
{% comment %}
The advanced board is a fixed-height workbench, not a document: it fills the
canvas edge to edge rather than sitting inside a padded container.
{% endcomment %}
<div
  id="leaderboard-detail-root"
  data-season-slug="{{ season.slug }}"
  data-initial-section="{{ initial_section }}"
  data-initial-user-id="{{ initial_user_id }}"
  data-logged-in-username="{{ request.user.username }}"
></div>
<script src="{% static 'js/bundle.js' %}"></script>
{% endblock %}
